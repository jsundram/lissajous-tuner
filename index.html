<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<!-- viewport-fit=cover pairs with the safe-area padding in styles.css to keep content clear of
     the notch / home indicator when installed. Forgetting the viewport tag entirely is a classic
     late fix — set it first. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">   <!-- no white flash before CSS in dark mode -->

<!-- Browser-UI tint, one per scheme. Must match styles.css --bg. -->
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1413" media="(prefers-color-scheme: dark)">

<!-- Install polish. iOS reads these + apple-touch-icon and mostly ignores the manifest;
     Android reads the manifest. Ship both. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "default", NOT "black-translucent": that one draws the page under the status bar and forces
     WHITE status-bar text, which is invisible against this app's light theme (#f4f3ef). The app
     is theme-aware, so the status bar must be too, and only "default" lets iOS decide. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tuner">
<link rel="manifest" href="./manifest.json">

<!-- Icons live in assets/. Run scripts/make-icons.sh to generate the PNGs from icon.svg. -->
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="icon" type="image/png" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-180.png">

<title>Lissajous Tuner — phase-coherent tuning for bowed strings</title>
<meta name="description" content="A strobe-style tuner for violin, viola and cello that shows tuning error as a rotating figure instead of a needle.">

<!-- Link previews. og:image MUST be an ABSOLUTE https URL to a RASTER (PNG/JPG), 1200x630, and
     kept reasonably small (compress it). iMessage/WhatsApp/Slack reject relative paths + SVG. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lissajous Tuner">
<meta property="og:title" content="Lissajous Tuner — phase-coherent tuning for bowed strings">
<meta property="og:description" content="A strobe-style tuner for violin, viola and cello that shows tuning error as a rotating figure instead of a needle.">
<meta property="og:url" content="https://jsundram.github.io/lissajous-tuner/">
<meta property="og:image" content="https://jsundram.github.io/lissajous-tuner/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A glowing green limaçon curve on a dark ground, above the words Lissajous Tuner.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Lissajous Tuner — phase-coherent tuning for bowed strings">
<meta name="twitter:description" content="A strobe-style tuner for violin, viola and cello that shows tuning error as a rotating figure instead of a needle.">
<meta name="twitter:image" content="https://jsundram.github.io/lissajous-tuner/assets/og.png">
<link rel="canonical" href="https://jsundram.github.io/lissajous-tuner/">

<!-- Pre-paint theme stamp. Reads the saved theme and sets data-theme on <html>
     BEFORE styles.css resolves, so a forced light/dark choice doesn't flash.
     Kept a dumb 3-liner on purpose — theme.js owns everything else; this must
     use the SAME key ("lt-theme") + attribute values so the two never disagree. -->
<script>
  try{ var t = localStorage.getItem("lt-theme");
       if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme", t); }catch(e){}
</script>

<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="tuner">

  <!-- Top bar: the ONLY three controls that ship. A tuner with fourteen sliders is a worse tuner —
       everything else lives behind ?dev=1 and gets baked into source once calibrated. -->
  <header class="bar">
    <div class="seg" id="instrument" role="radiogroup" aria-label="Instrument"></div>
    <div class="spacer"></div>
    <div class="stepper" aria-label="Reference A">
      <button type="button" id="refa-down" aria-label="Lower reference A">&minus;</button>
      <span id="refa-value">440.0</span>
      <button type="button" id="refa-up" aria-label="Raise reference A">+</button>
    </div>
    <div class="seg" id="temperament" role="radiogroup" aria-label="Temperament"></div>
    <button id="theme" type="button" class="theme-toggle">Auto</button>
  </header>

  <!-- The figure, as large as fits. Corner overlays sit ON it rather than beside it so the figure
       gets the whole square. -->
  <div class="stage">
    <canvas id="figure"></canvas>

    <div class="hud" aria-live="polite">
      <div class="hud-tl"><span id="string-name">&mdash;</span></div>
      <div class="hud-tr"><span id="target-hz"></span><small>target</small></div>
      <div class="hud-bl"><span id="measured-hz"></span><small>measured</small></div>
      <div class="hud-br"><span id="cents">&mdash;</span><small id="direction">&nbsp;</small></div>
    </div>

    <!-- Real UI for the states that actually happen: needing a gesture, being refused the mic,
         and hearing nothing. A console message is not a user interface. -->
    <div class="overlay" id="overlay">
      <div class="overlay-inner">
        <p id="overlay-msg">Tune a violin, viola or cello by watching a figure turn.</p>
        <button type="button" id="start" class="start">Start listening</button>
        <p class="overlay-note" id="overlay-note">Needs microphone access. Nothing is recorded or sent anywhere.</p>
      </div>
    </div>
  </div>

  <!-- Build id, ALWAYS visible (not dev-gated): a bug report is worthless without it. It sits in
       the normal flow rather than pinned to a corner — pinned, it collided with the last chip on a
       375px-wide phone, and an unreadable build id is the same as no build id. -->
  <div class="buildid" id="buildid" title="build"></div>

  <!-- The quartet-useful view: the whole instrument's state at a glance after one pass across
       the strings. -->
  <div class="chips" id="chips"></div>
</div>

<!-- Dev-only. Generated from Tuner.PARAMS, revealed by ?dev=1. -->
<aside class="dev" id="dev" hidden></aside>

<!-- Load order matters: strings.js and tuner.js expose globals app.js uses; build.js is a
     generated one-liner. -->
<script src="./build.js"></script>
<script src="./theme.js"></script>
<script src="./strings.js"></script>
<script src="./tuner.js"></script>
<script src="./app.js"></script>

<!-- GoatCounter (anonymous public stats). Cross-origin and async by design: deliberately NOT in
     sw.js's SHELL, so it simply no-ops offline instead of holding up a load. Last tag on the page. -->
<script data-goatcounter="https://lissajous.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
